name: Train and evaluate Sudoku
on:
  workflow_dispatch:
  push:
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/evaluate.yml'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python make_data.py && python nn.py
      - run: python run_demo.py | tee outputs/demo.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: model-and-demo
          path: |
            outputs/model.joblib
            outputs/metrics.json
            outputs/demo.*
      - run: python eval.py
      - uses: actions/upload-artifact@v4
        with:
          name: experiments
          path: |
            outputs/*.csv
            outputs/*.png
